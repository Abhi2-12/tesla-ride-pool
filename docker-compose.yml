services:
  postgres:
    image: postgres:17-alpine
    container_name: tesla-ride-pool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla
      POSTGRES_DB: tesla_ride_pool
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d tesla_ride_pool"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - tesla_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tesla-ride-pool-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://tesla:tesla@postgres:5432/tesla_ride_pool?schema=public"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tesla-ride-pool-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  tesla_postgres_data:
